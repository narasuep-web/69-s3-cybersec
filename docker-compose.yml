services:
  db:
    image: postgres:16-alpine
    container_name: 69-s3-db
    ports:
      - "54327:5432"
    environment:
      - POSTGRES_USER=narasuep.s
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=narasuep.s
    volumes:
      - db_data:/var/lib/postgresql/data

  admin:
    image: dpage/pgadmin4
    container_name: 69-s3-pgadmin
    ports:
      - "8084:80"
    environment:
      - PGADMIN_DEFAULT_EMAIL=narasuep-s@rmutp.ac.th
      - PGADMIN_DEFAULT_PASSWORD=password
    depends_on:
      - db

  my_app:
    image: prawee/strapi
    container_name: my_app
    restart: unless-stopped
    ports:
      - "8080:1337"
    environment:
      - DATABASE_CLIENT=postgres
      - DATABASE_HOST=db
      - DATABASE_PORT=5432
      - DATABASE_NAME=narasuep.s
      - DATABASE_USERNAME=narasuep.s
      - DATABASE_PASSWORD=password
    depends_on:
      - db

volumes:
  db_data: